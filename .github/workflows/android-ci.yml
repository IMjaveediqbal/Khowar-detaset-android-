name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Android build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest lintDebug compileReleaseKotlin --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Verify APK targets Android 16 (API 36)
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK"
          TARGET=$(
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" \\
              | sed -n "s/.*targetSdkVersion:'\\([0-9]*\\)'.*/\\1/p" \\
              | head -n 1
          )
          echo "APK target SDK: $TARGET"
          test "$TARGET" = "36"

      - name: Upload Android verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/schemas/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: khowar-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  functions-build:
    name: Firebase Functions build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Functions
        working-directory: functions
        run: npm test

      - name: Test Firebase rules and integration
        working-directory: functions
        run: npm run test:integration
